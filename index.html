*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} ::-webkit-scrollbar{display:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeX{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes slideRightIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideRightOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes slideDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,90,254,.45)}70%{box-shadow:0 0 0 8px rgba(61,90,254,0)}}
@keyframes blink{50%{opacity:.3}}
@keyframes caretFade{0%,100%{opacity:1}50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both}
.fx{animation:fadeX .3s cubic-bezier(.2,.8,.2,1) both}
.su{animation:slideUp .38s cubic-bezier(.2,.8,.2,1) both}
.sr{animation:slideRightIn .38s cubic-bezier(.2,.8,.2,1) both}
.sro{animation:slideRightOut .38s cubic-bezier(.2,.8,.2,1) both}
.sd{animation:slideDown .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.fadein{animation:fadein .3s ease both}
.fadeout{animation:fadeout .3s ease both}
.pop{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes toastdrop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes toastdropout{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-16px)}}
.toast-top>div{animation:toastdrop .3s cubic-bezier(.2,.8,.2,1) both}
.toast-out>div{animation:toastdropout .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes plpulse{0%{box-shadow:0 0 0 0 rgba(247,224,84,.6)}70%{box-shadow:0 0 0 12px rgba(247,224,84,0)}100%{box-shadow:0 0 0 0 rgba(247,224,84,0)}}
.pl-pulse{animation:plpulse 1.8s ease-out infinite}
@keyframes pldraw{from{stroke-dashoffset:var(--pl-len)}to{stroke-dashoffset:0}}
.pl-line{stroke-dasharray:var(--pl-len);stroke-dashoffset:var(--pl-len);animation:pldraw 1.1s cubic-bezier(.05,.9,.15,1) forwards}
@keyframes pldot{0%,62%{opacity:0;transform:translateY(-50%) scale(.4)}100%{opacity:1;transform:translateY(-50%) scale(1)}}
.pl-dot{opacity:0;animation:pldot 1.1s cubic-bezier(.05,.9,.15,1) forwards}
@keyframes kdotping{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
.kdot-ping{animation:kdotping 1.6s cubic-bezier(0,0,.2,1) infinite}
.tap{transition:transform .12s,opacity .12s;cursor:pointer;user-select:none}.tap:active{transform:scale(.97);opacity:.85}
.btn-soft{transition:transform .18s cubic-bezier(.34,1.56,.64,1),filter .12s ease}.btn-soft:active{transform:scale(.96);filter:brightness(1.12)}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:${d.soft};outline:none;touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid currentColor;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
input,button{font-family:inherit}

 gaming graphics and data-centre networking. Its results are widely treated as a barometer for AI infrastructure spending.",AMD:"AMD builds CPUs, GPUs and adaptive chips for data centres, PCs and embedded systems, positioning its Instinct accelerators as the main challenger to Nvidia in AI compute.",TSM:"TSMC is the world's largest contract chip manufacturer, fabricating designs for Apple, Nvidia, AMD and others. Its leading-edge nodes make it a chokepoint for the entire semiconductor industry.",ARM:"Arm licenses the CPU architecture used in nearly every smartphone, and increasingly in data-centre and automotive silicon. It earns licence fees and per-chip royalties rather than selling chips itself.",INTC:"Intel designs and manufactures x86 processors for PCs and servers, and is investing heavily in becoming a contract foundry for external customers.",MU:"Micron makes DRAM and NAND memory. Its earnings swing sharply with memory pricing cycles, which AI server demand has recently tightened.",ASML:"ASML is the sole supplier of EUV lithography machines, the equipment required to produce the most advanced chips. That monopoly makes it structurally central to the industry.",AVGO:"Broadcom combines networking and custom-silicon businesses with a large enterprise software arm, and co-designs bespoke AI accelerators for hyperscale customers.",QCOM:"Qualcomm supplies mobile processors and modems, and licenses a broad wireless patent portfolio, while expanding into automotive and PC chips.",SKHY:"SK Hynix is a major memory manufacturer and an early leader in high-bandwidth memory (HBM), the memory type used alongside AI accelerators.",SNDK:"SanDisk supplies NAND flash storage products across consumer and enterprise segments.",KIOXIA:"Kioxia, formerly Toshiba Memory, is one of the largest NAND flash producers and a pioneer of the technology.",MSFT:"Microsoft spans cloud (Azure), productivity software, Windows and gaming, and is a principal commercial partner in the deployment o
